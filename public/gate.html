<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>私人访问 · Crypto Screener</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1220;
        color: #e5eefc;
      }
      .card {
        width: min(92vw, 380px);
        background: #121a2b;
        border: 1px solid #243148;
        border-radius: 14px;
        padding: 1.5rem;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.15rem;
      }
      p {
        margin: 0 0 1rem;
        color: #93a4c3;
        font-size: 0.9rem;
        line-height: 1.45;
      }
      label {
        display: block;
        font-size: 0.8rem;
        margin-bottom: 0.35rem;
        color: #b7c6e0;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border-radius: 10px;
        border: 1px solid #31425f;
        background: #0b1220;
        color: #e5eefc;
        padding: 0.7rem 0.8rem;
        margin-bottom: 0.85rem;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 0.75rem;
        background: #3b82f6;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #2563eb;
      }
      .err {
        color: #fca5a5;
        font-size: 0.85rem;
        margin: -0.4rem 0 0.8rem;
        display: none;
      }
      .err.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>私人研究站点</h1>
      <p>已启用访问门禁。请输入部署时设置的 <code>SITE_PASSWORD</code>。</p>
      <p class="err" id="err">密码错误，请重试。</p>
      <form method="POST" action="/api/auth">
        <label for="password">访问密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
        <button type="submit">进入</button>
      </form>
    </main>
    <script>
      if (new URLSearchParams(location.search).get('error') === '1') {
        document.getElementById('err').classList.add('show')
      }
    </script>
  </body>
</html>
